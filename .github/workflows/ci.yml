# Lint, test and build on every push. Pushes to main, and to the working branch while Stages 1 to 6
# are built, publish the build to GitHub Pages and check the published address in Chromium (Linux),
# Firefox and WebKit (macOS). Publishing waits only for the Linux check job.
#
# TEMPORARY (decision BR-1): the Firefox job does not block publishing until its failure is fixed.
# It still runs and fails visibly on every push. Firefox and WebKit must both block publishing
# again before Stage 12 (Book 3, Stage 12 acceptance check).
#
# Repository settings needed once:
# - Settings > Pages > Build and deployment > Source: "GitHub Actions".
# - Settings > Environments > github-pages > Deployment branches: allow claude/lucid-bell-kgmdfi
#   (only while that branch is published; main is allowed by default).
name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on a published branch part-way through publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/lucid-bell-kgmdfi' }}

jobs:
  check:
    name: Lint, test, build and Chromium smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium
      - name: Keep the built site for Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/lucid-bell-kgmdfi')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Does not block publishing for now (decision BR-1, temporary); no continue-on-error, so a
  # failure still shows red on every run.
  browsers-firefox:
    name: Firefox smoke test (macOS, temporarily not blocking publishing)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install firefox
      - run: npm run test:browser -- --project=firefox
      - name: Keep the failed tests' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-firefox-macos
          path: test-results
          retention-days: 7

  # WebKit does not block publishing (decision S1-18): it stalls on CI for reasons not yet found,
  # and the user checks real Safari at the published link. Its result stays visible on every run.
  browsers-webkit:
    name: WebKit smoke test (macOS, does not block publishing)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npm run test:browser -- --project=webkit
      - name: Keep the failed tests' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-webkit-macos
          path: test-results
          retention-days: 7

  # EXPERIMENT (temporary): Firefox and WebKit on Linux, headless and headed under a virtual
  # display, to see whether software WebGL2 there now runs the game. Never blocks anything.
  browsers-linux-probe:
    name: Experiment - ${{ matrix.browser }} on Linux (${{ matrix.mode }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        mode: [headless, headed]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: What WebGL2 the browser offers
        run: |
          cat > "$RUNNER_TEMP/probe.mjs" <<'PROBE'
          import { createRequire } from 'node:module';
          const require = createRequire(process.cwd() + '/package.json');
          const pw = require('@playwright/test');
          const [name, mode] = process.argv.slice(2);
          const browser = await pw[name].launch({
            headless: mode !== 'headed',
            ...(name === 'firefox' ? { firefoxUserPrefs: { 'webgl.force-enabled': true } } : {}),
          });
          const page = await browser.newPage();
          await page.setContent('<canvas id="c" width="64" height="64"></canvas>');
          const info = await page.evaluate(() => {
            const c = document.getElementById('c');
            const gl = c.getContext('webgl2');
            if (gl === null) return { webgl2: false };
            const dbg = gl.getExtension('WEBGL_debug_renderer_info');
            const vs = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vs, '#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}');
            gl.compileShader(vs);
            return {
              webgl2: true,
              renderer: gl.getParameter(dbg === null ? gl.RENDERER : dbg.UNMASKED_RENDERER_WEBGL),
              version: gl.getParameter(gl.VERSION),
              compiled: gl.getShaderParameter(vs, gl.COMPILE_STATUS),
              lost: gl.isContextLost(),
            };
          });
          console.log(name, mode, JSON.stringify(info));
          await browser.close();
          PROBE
          if [ "${{ matrix.mode }}" = headed ]; then
            xvfb-run -a node "$RUNNER_TEMP/probe.mjs" ${{ matrix.browser }} headed
          else
            node "$RUNNER_TEMP/probe.mjs" ${{ matrix.browser }} headless
          fi
      - name: Browser tests
        run: |
          if [ "${{ matrix.mode }}" = headed ]; then
            xvfb-run -a npm run test:browser -- --project=${{ matrix.browser }} --headed
          else
            npm run test:browser -- --project=${{ matrix.browser }}
          fi
      - name: Keep the failed tests' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-linux-${{ matrix.mode }}
          path: test-results
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    # Restore browsers-firefox here (and make WebKit blocking) before Stage 12: decision BR-1.
    needs: [check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/lucid-bell-kgmdfi')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  published:
    name: Smoke-test the published address (Chromium)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}

  published-firefox:
    name: Smoke-test the published address (Firefox, macOS)
    needs: deploy
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install firefox
      - run: npm run test:browser -- --project=firefox
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}

  published-webkit:
    name: Smoke-test the published address (WebKit, macOS, does not block)
    needs: deploy
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:browser -- --project=webkit
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
