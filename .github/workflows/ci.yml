# Lint, test and build on every push. Pushes to main, and to the working branch while Stages 1 to 6
# are built, publish the build to GitHub Pages and check the published address in Chromium (Linux),
# Firefox and WebKit (macOS). Publishing waits only for the Linux check job.
#
# TEMPORARY (decision BR-1): the Firefox job does not block publishing until its failure is fixed.
# It still runs and fails visibly on every push. Firefox and WebKit must both block publishing
# again before Stage 12 (Book 3, Stage 12 acceptance check).
#
# Repository settings needed once:
# - Settings > Pages > Build and deployment > Source: "GitHub Actions".
# - Settings > Environments > github-pages > Deployment branches: allow claude/lucid-bell-kgmdfi
#   (only while that branch is published; main is allowed by default).
name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on a published branch part-way through publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/lucid-bell-kgmdfi' }}

jobs:
  check:
    name: Lint, test, build and Chromium smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The system libraries come from Ubuntu's mirrors, which are sometimes unreachable from the
      # runners; the runner image already has what Chromium needs, so fall back to the browser alone.
      - name: Install Chromium for the smoke test
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:browser -- --project=chromium
      - name: Keep the built site for Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/lucid-bell-kgmdfi')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Does not block publishing for now (decision BR-1, temporary); no continue-on-error, so a
  # failure still shows red on every run.
  browsers-firefox:
    name: Firefox smoke test (macOS, temporarily not blocking publishing)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install firefox
      # For the log only: never fails the job.
      - name: What WebGL2 the browser offers
        run: node tests/browser/webgl-probe.ts firefox || true
      - run: npm run test:browser -- --project=firefox
      - name: Keep the failed tests' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-firefox-macos
          path: test-results
          retention-days: 7

  # WebKit does not block publishing (decision S1-18): it stalls on CI for reasons not yet found,
  # and the user checks real Safari at the published link. Its result stays visible on every run.
  browsers-webkit:
    name: WebKit smoke test (macOS, does not block publishing)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      # For the log only: never fails the job.
      - name: What WebGL2 the browser offers
        run: node tests/browser/webgl-probe.ts webkit || true
      - run: npm run test:browser -- --project=webkit
      - name: Keep the failed tests' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-webkit-macos
          path: test-results
          retention-days: 7

  # EXPERIMENT (temporary): where can WebKit run the game? On the macOS runners its WebGL context is
  # lost as soon as it is made (the probe reads renderer "null", lost: true). Tried here: Linux in
  # Playwright's own image, which carries every library WebKit needs (Ubuntu's mirrors have been
  # unreachable from the runners), headless and headed under a virtual display. Never blocks.
  browsers-webkit-probe:
    name: Experiment - WebKit on Linux in Playwright's image (${{ matrix.mode }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, headed]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: What WebGL2 the browser offers
        run: |
          if [ "${{ matrix.mode }}" = headed ]; then
            xvfb-run -a node tests/browser/webgl-probe.ts webkit headed || true
          else
            node tests/browser/webgl-probe.ts webkit || true
          fi
      - name: Browser tests
        run: |
          if [ "${{ matrix.mode }}" = headed ]; then
            xvfb-run -a npm run test:browser -- --project=webkit --headed
          else
            npm run test:browser -- --project=webkit
          fi
      - name: Keep the failed tests' screenshots and page snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-webkit-linux-${{ matrix.mode }}
          path: test-results
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    # Restore browsers-firefox here (and make WebKit blocking) before Stage 12: decision BR-1.
    needs: [check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/lucid-bell-kgmdfi')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  published:
    name: Smoke-test the published address (Chromium)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:browser -- --project=chromium
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}

  published-firefox:
    name: Smoke-test the published address (Firefox, macOS)
    needs: deploy
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install firefox
      - run: npm run test:browser -- --project=firefox
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}

  published-webkit:
    name: Smoke-test the published address (WebKit, macOS, does not block)
    needs: deploy
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:browser -- --project=webkit
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
